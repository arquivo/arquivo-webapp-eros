backend.url = https://preprod.arquivo.pt
wayback.url = ${backend.url}/wayback
pywb.url = ${backend.url}/noFrame/replay
services.archivepagenow.url = ${backend.url}/save/now/record/
screenshot.url = ${backend.url}/screenshot
patching.url = ${backend.url}/noFrame/patching/record
contame.historias.url = https://contamehistorias.pt
contame.historias.search.url = ${contame.historias.url}/arquivopt/search
#service to replay websites in an old browser:
oldweb.today.url = https://oldweb.today/
oldweb.today.browser = ff10
oldweb.today.fullUrl = ${oldweb.today.url}?browser=${oldweb.today.browser}

image.search.api = ${backend.url}/imagesearch
query.suggestion.api = ${backend.url}/spellchecker/checker
query.suggestion.api_enabled = false
text.search.api.default = ${backend.url}/textsearch
text.search.api.yearBalance_enabled = false
# Ask the text search API for a spellchecked query ("Did you mean") on page and image searches
text.search.api.spellcheck_enabled = true
cdx.api = ${wayback.url}/cdx

webapp.showContameHistoriasButton = true
# Express "trust proxy" (env EXPRESS_TRUST_PROXY): which reverse proxies may set the
# client IP with X-Forwarded-For. Empty or false: none (req.ip is the TCP peer);
# a number: that many proxy hops; otherwise addresses or subnets, e.g. 172.16.0.0/12.
# "true" is refused: it would let any client choose its IP.
# See https://expressjs.com/en/guide/behind-proxies.html
express.trust.proxy =
session.secret = dontWorryThisIsDifferentInProduction
session.length = 604800000
# Session lengths:
# 1 day: 86400000
# 1 week: 604800000
# 1 month: 2592000000
# 1 year: 31536000000

logger.type = console
logger.dir = logs/
# Lowest level written (env LOGGER_LEVEL): error, warn, info, http, verbose, debug or silly.
# debug writes personal data (URLs, error messages): enable it only briefly, never by
# default in production.
logger.level = info
# logger types:
#  console - displays on console
#  file    - writes on a file on logger.dir
#  daily   - creates a new file each day on logger.dir, writes on it

search.start.date = 19910806
text.results.per.page = 10
image.results.per.page = 25

google.tagmanager.id = GTM-5SZHXPRP
google.tagmanager.auth = pgtJh7tfoefN-N0UMQ5kzQ
google.tagmanager.preview = env-2

citation.saver.google.sheet.id = 1Js-QI1IUkW14gge5301U4pur711pVOiEZP3vTLYu2c8
citation.saver.max.upload.size = 100000000
citation.saver.upload.folder.path = uploads/CitationSaver
# At most max Citation Saver submissions per client IP in each window (milliseconds).
# Empty or 0 turns the limit off (the default) until the deployment forwards a
# trustworthy client IP: see express.trust.proxy.
# Env: CITATION_SAVER_RATE_LIMIT_MAX, CITATION_SAVER_RATE_LIMIT_WINDOW_MS
citation.saver.rate.limit.max =
citation.saver.rate.limit.window.ms = 900000
# Folder for uploads in progress (env CITATION_SAVER_UPLOAD_TEMP_FOLDER_PATH). Empty means
# .citationsaver-tmp next to the upload folder (uploads/.citationsaver-tmp), which is on
# the writable uploads volume of the read-only production container. It must not be
# inside the upload folder.
citation.saver.upload.temp.folder.path =
