#translations for advanced search
accessibility:
  title:
    pt: Formulário de pesquisa avançada de páginas
    en: Page advanced search form
  legend:
    pt: Preencha o formulário
    en: Fill the form
fieldset:
  date:
    label:
      pt: '<strong>Data</strong>:'
      en: '<strong>Date</strong>:'
  with:
    label: 
      pt: 'Tenham estas <strong>palavras</strong>:'
      en: 'With these <strong>words</strong>:'
    example:
      pt: 'ex. expo 98'
      en: 'e.g. group draw'
  phrase:
    label:
      pt: 'Tenham esta <strong>expressão ou frase</strong>:'
      en: 'With this <strong>phrase</strong>:'
    example:
      pt: 'ex. pavilhão da utopia'
      en: 'e.g. euro 2004'
  without:
    label:
      pt: '<strong>Não tenham</strong> estas palavras:'
      en: '<strong>Without</strong> any of these words:'
    example:
      pt: 'ex. concerto'
      en: 'e.g. rugby'
  format:
    label:
      pt: '<strong>Formato</strong>:'
      en: '<strong>Format</strong>:'
    option:
      all:
        pt: Todos os formatos
        en: All formats
  website:
    label:
      pt: '<strong>Sítios Web,</strong> separados por vírgulas:'
      en: '<strong>Websites,</strong> separated by commas:'
    example:
      pt: 'ex. www.fccn.pt, www.fct.pt'
      en: 'e.g. www.fccn.pt, www.fct.pt'
  language:
    label:
      pt: '<strong>Idioma</strong>:'
      en: '<strong>Language</strong>:'
    example:
      pt: 'Para filtrar por idioma indique: <code>pt</code> para Português, <code>en</code> para Inglês, <code>es</code> para Espanhol. Usamos o formato de 2 caracteres <a href="https://pt.wikipedia.org/wiki/ISO_639-1" target="_blank" rel="noopener noreferrer">ISO 639-1</a> - <a href="https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes" target="_blank" rel="noopener noreferrer">lista completa</a>.'
      en: 'To filter by language add: <code>pt</code> for Portuguese, <code>en</code> for English, <code>es</code> for Spanish. We use the <a href="https://en.wikipedia.org/wiki/ISO_639-1" target="_blank" rel="noopener noreferrer">ISO 639-1</a> 2 characters format - <a href="https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes" target="_blank" rel="noopener noreferrer">complete list</a>.'
  minLanguageConfidence:
    label:
      pt: '<strong>Confiança mínima</strong> na deteção do idioma:'
      en: '<strong>Minimum confidence</strong> of the language detection:'
    example:
      pt: 'Uma confiança mais baixa inclui também os resultados de confiança mais alta.'
      en: 'A lower confidence also includes the results with a higher confidence.'
    option:
      default:
        pt: Predefinida
        en: Default
      high:
        pt: Alta
        en: High
      medium:
        pt: Média
        en: Medium
      low:
        pt: Baixa
        en: Low
  yearBalance:
    label:
      pt: '<strong>Equilíbrio entre anos</strong>:'
      en: '<strong>Year balance</strong>:'
    example:
      pt: 'Valoriza as páginas dos anos com menos conteúdo arquivado. De 0 (sem efeito) a 1 (efeito máximo).'
      en: 'Favours pages from the years with less archived content. From 0 (no effect) to 1 (strongest effect).'
    option:
      none:
        pt: Desligado
        en: 'Off'
      default:
        pt: Ligado
        en: 'On'
  results:
    label:
      pt: '<strong>Número de resultados</strong>:'
      en: '<strong>Number of results</strong>:'
  search:
    en: Search
    pt: Pesquisar
    
