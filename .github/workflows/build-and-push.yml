name: Build and Push Docker Images
description: This workflow builds and pushes Docker images

on:
  push:
    branches:
      - main
      - master
      - development
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master
      - development

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Smoke test (boot the app and verify it serves)
        run: |
          node server.js &
          APP_PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "App responded on / (attempt $i)"; ok=1; break
            fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::App failed to serve / on :3000 — boot smoke test failed"
            exit 1
          fi

      - name: SonarCloud analysis
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: SonarSource/sonarcloud-github-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            arquivo/arquivo-webapp
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development' }}
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: production

      - name: Logout from Docker Hub
        if: github.event_name != 'pull_request'
        run: docker logout
